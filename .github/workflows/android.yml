name: Android APK (template - not active in this repo)

# =============================================================================
# READ THIS FIRST
# =============================================================================
# MathChallenge is a Windows PowerShell/WPF desktop app. This repository has no
# `gradlew`, no `build.gradle`, no `AndroidManifest.xml` and no Java/Kotlin
# sources, so there is nothing here that can produce an APK. That is why this
# workflow:
#
#   * has its tag trigger COMMENTED OUT, so it never fires on a tag push and
#     never puts a red X on this repo's Actions tab, and
#   * is `workflow_dispatch` only, and detects the missing Android project and
#     exits cleanly with instructions instead of erroring out.
#
# To use it for a real Android project (this repo, or another one):
#   1. Copy this file to `.github/workflows/android.yml` in that repo.
#   2. Uncomment the `push: tags:` block below.
#   3. Set GRADLE_PROJECT_DIR if the Gradle project is not at the root
#      (React Native: `android`).
#   4. Push a tag:  git tag v1.0 && git push origin v1.0
#   5. The APK/AAB is attached to a GitHub Release on that same tag.
#
# Compared with the `sangatdesai/release-apk` marketplace action this replaces:
#   * Current action majors, all on Node 24: checkout@v7, setup-java@v6
#     (v1-v4 are officially deprecated), setup-gradle@v6, upload-artifact@v7.
#     Self-hosted runners need Actions Runner v2.327.1+ for checkout@v5+.
#   * JDK 17, which AGP 8.x requires (JDK 11 only works up to AGP 7.x).
#   * Gradle dependency caching via `gradle/actions/setup-gradle`.
#   * Publishing with the preinstalled `gh` CLI and the built-in GITHUB_TOKEN.
#     The marketplace README asks you to store a personal access token with
#     `repo` scope as a secret; that is not needed to publish to your own
#     repository, and a long-lived PAT sitting in repo secrets is an avoidable
#     risk.
#   * Optional release signing - an unsigned release APK cannot be installed.
#   * Flutter is not covered by this file: use `subosito/flutter-action` and
#     `flutter build apk --release` instead of the Gradle step.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle task'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease   # produces an .aab for Google Play, not an installable .apk
  # --- UNCOMMENT TO ENABLE TAG-TRIGGERED RELEASES IN AN ANDROID REPO ----------
  # push:
  #   tags:
  #     - 'v*'
  #     - '[0-9]*'
  # ----------------------------------------------------------------------------

permissions:
  contents: write

env:
  GRADLE_PROJECT_DIR: .      # React Native: 'android'. Where gradlew lives.
  JAVA_VERSION: '17'         # AGP 8.x -> 17, AGP 7.x -> 11

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Job level, not step level: a step's own `env` is not visible to that
      # same step's `if`, which is GitHub's documented reason for hoisting a
      # secret you need to test in a condition. Trade-off: this value is then
      # present in every step of this job.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect an Android project
        id: detect
        run: |
          set -euo pipefail
          android=false
          detail=""

          if [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ] ||
             [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            android=true
            detail="Gradle wrapper or build file at the repository root"
          elif [ -n "$(find . -maxdepth 3 -not -path './.git/*' \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit || true)" ]; then
            android=true
            detail="Gradle build file in a subdirectory (set GRADLE_PROJECT_DIR)"
          elif [ -d android ] && { [ -f package.json ] || [ -f pubspec.yaml ]; }; then
            android=true
            detail="React Native or Flutter project with an android/ folder (set GRADLE_PROJECT_DIR=android)"
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          [ -n "$detail" ] && echo "Detected: $detail" || echo "No Gradle project detected."

      - name: No Android project here - stopping
        if: steps.detect.outputs.android != 'true'
        run: |
          echo "::notice title=Android APK workflow skipped::No Gradle project found in this repository."
          echo "This repo builds a Windows PowerShell/WPF app - see .github/workflows/release.yml,"
          echo "which packages MathChallenge.ps1 into an .exe and attaches it to a release."
          echo "Producing an APK requires an Android project (gradlew + app/build.gradle)."

      - name: Set up JDK
        if: steps.detect.outputs.android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (dependency + build caching)
        if: steps.detect.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v6

      # -----------------------------------------------------------------------
      # OPTIONAL: sign the release build.
      # An APK from `assembleRelease` is UNSIGNED unless build.gradle declares a
      # signingConfig, and Android refuses to install an unsigned APK.
      #
      # Secrets to create (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64   -> `base64 -w0 release.keystore` (Linux/macOS) or
      #                        `certutil -encode release.keystore out.b64` (Windows)
      #   KEYSTORE_PASSWORD -> keystore password
      #   KEY_ALIAS         -> key alias
      #   KEY_PASSWORD      -> key password
      #
      # And in app/build.gradle.kts:
      #   android {
      #     signingConfigs {
      #       create("release") {
      #         storeFile = file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
      #         storePassword = System.getenv("KEYSTORE_PASSWORD")
      #         keyAlias = System.getenv("KEY_ALIAS")
      #         keyPassword = System.getenv("KEY_PASSWORD")
      #       }
      #     }
      #     buildTypes { release { signingConfig = signingConfigs.getByName("release") } }
      #   }
      # -----------------------------------------------------------------------
      - name: Restore signing keystore
        if: steps.detect.outputs.android == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore restored ($(wc -c < release.keystore) bytes)."

      - name: Build with Gradle
        if: steps.detect.outputs.android == 'true'
        env:
          VARIANT: ${{ github.event.inputs.variant || 'assembleRelease' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$GRADLE_PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew "$VARIANT" --stacktrace --no-daemon

      - name: Collect build outputs
        if: steps.detect.outputs.android == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$GRADLE_PROJECT_DIR" -type f \( -name '*.apk' -o -name '*.aab' \) \
            -not -path '*/intermediates/*' -print -exec cp {} dist/ \;
          count="$(find dist -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::Gradle finished but no .apk or .aab was found under $GRADLE_PROJECT_DIR."
            exit 1
          fi
          ls -lh dist

      - name: Upload artifacts
        if: steps.detect.outputs.android == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release for this tag
        if: steps.detect.outputs.android == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --latest
          fi
